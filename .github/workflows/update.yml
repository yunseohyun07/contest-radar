name: 대회 수집 및 배포

on:
  schedule:
    - cron: "0 21 * * *"   # 매일 한국 시간 오전 6시
    - cron: "0 9 * * *"    # 매일 한국 시간 오후 6시
  workflow_dispatch:        # Actions 탭에서 "Run workflow"로 바로 실행
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 수집기 테스트
        run: python -m unittest discover tests -v

      - name: 대회 수집
        run: python collector/collect.py

      - name: 수집 결과 저장
        run: |
          git config user.name "contest-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data site/feeds site/ics
          if git diff --cached --quiet; then
            echo "바뀐 내용 없음"
          else
            git commit -m "대회 정보 업데이트 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
